<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-label="Team mode: one shared vault in the middle with notes and projects, and one personal folder per person around it. An admin and members. A pre-commit gate guards the personal folders.">
<style>
.t{font:800 14px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:1.5px}
.s{font:400 13px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#8a8a8a}
.m{font:500 12.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
</style>
<rect width="900" height="400" fill="#0d0d0d"/>
<g stroke="#3a3a3a" stroke-width="1.5" stroke-dasharray="4 5">
<line x1="450" y1="200" x2="160" y2="90"/><line x1="450" y1="200" x2="160" y2="310"/><line x1="450" y1="200" x2="740" y2="90"/><line x1="450" y1="200" x2="740" y2="310"/>
</g>
<!-- shared core -->
<circle cx="450" cy="200" r="104" fill="#161616" stroke="#3a3a3a" stroke-width="2"/>
<g stroke="#3a3a3a" stroke-width="1.2"><line x1="400" y1="170" x2="470" y2="150"/><line x1="470" y1="150" x2="500" y2="215"/><line x1="400" y1="170" x2="420" y2="240"/><line x1="420" y1="240" x2="500" y2="215"/><line x1="470" y1="150" x2="420" y2="240"/></g>
<circle cx="400" cy="170" r="7" fill="#d8d8d8"/><circle cx="470" cy="150" r="9" fill="#d8d8d8"/><circle cx="500" cy="215" r="7" fill="#d8d8d8"/><circle cx="420" cy="240" r="8" fill="#d8d8d8"/>
<text x="450" y="330" text-anchor="middle" class="t" fill="#ececec">SHARED</text>
<text x="450" y="349" text-anchor="middle" class="s">notes/ · projects/ · tasks/</text>
<!-- people -->
<g>
<rect x="60" y="50" width="200" height="80" rx="10" fill="#1c1c1c" stroke="#ff7a1a" stroke-width="2"/>
<text x="160" y="80" text-anchor="middle" class="t" fill="#ff7a1a">ANA · ADMIN</text>
<text x="160" y="102" text-anchor="middle" class="m" fill="#b8b8b8">people/ana/</text>
<text x="160" y="120" text-anchor="middle" class="s">memory · inbox · diary</text>
<rect x="60" y="270" width="200" height="80" rx="10" fill="#1c1c1c" stroke="#3a3a3a" stroke-width="2"/>
<text x="160" y="300" text-anchor="middle" class="t" fill="#ececec">JOHN · MEMBER</text>
<text x="160" y="322" text-anchor="middle" class="m" fill="#b8b8b8">people/john/</text>
<text x="160" y="340" text-anchor="middle" class="s">memory · inbox · diary</text>
<rect x="640" y="50" width="200" height="80" rx="10" fill="#1c1c1c" stroke="#3a3a3a" stroke-width="2"/>
<text x="740" y="80" text-anchor="middle" class="t" fill="#ececec">MARIA · MEMBER</text>
<text x="740" y="102" text-anchor="middle" class="m" fill="#b8b8b8">people/maria/</text>
<text x="740" y="120" text-anchor="middle" class="s">memory · inbox · diary</text>
<rect x="640" y="270" width="200" height="80" rx="10" fill="#1c1c1c" stroke="#3a3a3a" stroke-width="2"/>
<text x="740" y="300" text-anchor="middle" class="t" fill="#ececec">LUCAS · MEMBER</text>
<text x="740" y="322" text-anchor="middle" class="m" fill="#b8b8b8">people/lucas/</text>
<text x="740" y="340" text-anchor="middle" class="s">memory · inbox · diary</text>
</g>
<text x="450" y="30" text-anchor="middle" class="s">a commit that touches someone else's folder is blocked by the pre-commit gate</text>
<text x="450" y="382" text-anchor="middle" class="s">people/&lt;you&gt;/private/ is git-ignored: it never leaves your machine</text>
</svg>
