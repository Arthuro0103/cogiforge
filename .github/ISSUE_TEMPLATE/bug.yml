name: Bug report
description: Something does not work as expected
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Version and OS
      placeholder: "e.g. 0.3.1, macOS 15"
  - type: markdown
    attributes:
      value: "Do not paste secrets, tokens or personal data."
