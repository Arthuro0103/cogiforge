name: proof

# The CI is the public proof: it runs the whole cycle in a stranger's clone.
# Each step below exists because a failure of it has already happened (see WHY.md, when it exists).

on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"   # every Monday: catches what rotted without a commit

jobs:
  proof:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - run: python -m pip install pytest

      - name: git identity (only for the test commits)
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.com"

      - name: install.sh in a clean clone — it has to activate hooksPath
        run: |
          test -z "$(git config --get core.hooksPath)" || { echo "hooksPath was already active: the clone is not clean"; exit 1; }
          sh install.sh
          test "$(git config --get core.hooksPath)" = ".githooks"

      - name: install.sh twice — the Claude Code read-deny rules from private.txt are there and not duplicated
        run: |
          python core/private.py --check
          before=$(cat .claude/settings.json)
          sh install.sh
          test "$before" = "$(cat .claude/settings.json)"

      - name: exact count per check over demo/ (the fixture's meta-assertion)
        run: python tests/counts.py

      - name: pytest
        run: python -m pytest -q -rs

      - name: mutation — every mutant has to die
        run: python tests/mutate.py

      - name: leak.py on the repo itself
        run: |
          rc=0; python core/leak.py . > leak.txt || rc=$?
          cat leak.txt
          echo "finding lines: $(grep -cE '^[^ ]+:[0-9]+: ' leak.txt || true)"
          exit $rc

      - name: end to end — an orphan blocks, a link releases, removing hooksPath turns the test red
        run: |
          set -u
          orphan=vault/notes/learning/ci-orphan.md
          printf -- '---\narea: learning\n---\n# Note without an edge\n\nText without a link.\n' > "$orphan"
          git add "$orphan"
          if git commit -q -m "ci: orphan"; then echo "FAILED: the orphan commit passed"; exit 1; fi
          printf '\nBack to [[home]].\n' >> "$orphan"
          git add "$orphan"
          git commit -q -m "ci: with link"
          git config --unset core.hooksPath
          # rc 1 = the test was found and failed, which is expected without hooksPath.
          # Any other rc (0 green, 4 test not found because it was renamed) breaks the CI:
          # before, a renamed test gave rc 4, the `if` was false and the step passed without testing anything.
          rc=0
          python -m pytest -q tests/test_hook_active.py::test_hookspath_points_to_githooks || rc=$?
          if [ "$rc" -ne 1 ]; then
            echo "FAILED: expected the test red (rc 1) without hooksPath, got rc=$rc"; exit 1
          fi
          echo "ok: the test went red without hooksPath, as it should"
          git config core.hooksPath .githooks

      - name: equivalence with the Brain
        run: |
          rc=0; python -m pytest -q -rs tests/test_equivalence.py > equiv.txt || rc=$?
          cat equiv.txt
          if grep -q "SKIPPED" equiv.txt; then
            echo "NOT_VERIFIED: equivalence with the Brain did not run (brain absent in this environment)."
          fi
          exit $rc

  # Windows is INFORMATIONAL: continue-on-error means a red run here does not turn the proof red.
  # [VERIFY] Nobody has confirmed this job green yet; see docs/WINDOWS.md for what is and is not known.
  windows:
    name: windows-latest / py3.12 (informational)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install pytest

      - name: git identity (only for the test commits)
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.com"

      - name: python3 has to resolve inside Git's sh (the hook calls it); add an alias if it does not
        shell: bash
        run: |
          if ! python3 -c 'import sys' 2>/dev/null; then
            dir=$(dirname "$(command -v python)")
            cp "$dir/python.exe" "$dir/python3.exe"
          fi
          python3 -V

      - name: install.ps1 in a clean clone — it has to activate hooksPath
        shell: pwsh
        run: |
          if (git config --get core.hooksPath) { throw "hooksPath was already active: the clone is not clean" }
          ./install.ps1
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 failed" }
          if ((git config --get core.hooksPath) -ne ".githooks") { throw "hooksPath not set" }

      - name: install.ps1 twice — the Claude Code deny rules must not duplicate
        shell: bash
        run: |
          python core/private.py --check
          before=$(cat .claude/settings.json)
          powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1
          test "$before" = "$(cat .claude/settings.json)"

      - name: pytest
        run: python -m pytest -q -rs

      - name: leak.py on the repo itself
        run: python core/leak.py .
